<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faznet · IPTV player falas për Android TV</title>
<meta name="description" content="Faznet — player IPTV falas për Android TV dhe telefon. Shkarko APK-në dhe ngarko playlist-ën me MAC dhe PIN.">
<meta name="theme-color" content="#0b1030">
<link rel="icon" href="icon.png">
<style>
  :root{--bg:#0b1030;--surface:#141b45;--surface2:#1e2766;--line:#2a3475;--text:#eef1ff;--dim:#a0a8d0;--accent:#4f6bff;--accent2:#8a4dff;--ok:#2ec27e;--err:#ff5d6c;--gold:#ffc94d}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2a2f8a 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#3a1f7a 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
  .container{max-width:1080px;margin:0 auto;padding:0 20px}
  /* nav */
  nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(11,16,48,.72);border-bottom:1px solid rgba(255,255,255,.06)}
  nav .container{display:flex;align-items:center;gap:12px;height:64px}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none}
  nav .brand img{width:34px;height:34px;border-radius:10px}
  nav .links{margin-left:auto;display:flex;gap:4px}
  nav .links a{text-decoration:none;color:var(--dim);font-size:14px;padding:8px 12px;border-radius:999px}
  nav .links a:hover{color:#fff;background:rgba(255,255,255,.06)}
  nav .links a.cta{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media (max-width:640px){nav .links a:not(.cta){display:none}}
  /* hero */
  .hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-top:64px;padding-bottom:40px}
  @media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr);padding-top:36px}}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .badge b{color:#fff}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(46,194,126,.18)}
  .hero h1{font-size:clamp(34px,5.2vw,56px);line-height:1.05;margin:18px 0 14px;letter-spacing:-.02em}
  .grad{background:linear-gradient(90deg,#7f95ff,#b38bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lead{color:var(--dim);font-size:17px;max-width:520px;margin:0 0 26px}
  .dl{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:12px;text-decoration:none;border-radius:14px;padding:13px 18px;font-weight:700;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn small{display:block;font-weight:500;font-size:12px;opacity:.85}
  .btn svg{width:26px;height:26px;flex:none}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 30px -10px rgba(110,90,255,.8)}
  .btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}
  .note{color:var(--dim);font-size:13px;margin-top:14px}
  /* TV mockup */
  .tv{position:relative;aspect-ratio:16/10;border-radius:18px;padding:10px;background:#05071a;border:1px solid #2b3370;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 6px rgba(255,255,255,.03)}
  .tv:after{content:"";position:absolute;left:38%;right:38%;bottom:-18px;height:8px;border-radius:0 0 8px 8px;background:#1a1f45}
  .screen{height:100%;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1b2266,#0b1030 60%,#070a20);display:grid;grid-template-rows:auto 1fr;font-size:10px}
  .s-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
  .s-top i{display:block;width:14px;height:14px;border-radius:4px;background:url(icon.png) center/cover}
  .s-top .pill{flex:1;height:14px;border-radius:7px;background:#141b45}
  .s-top .clock{color:#fff;font-weight:700}
  .s-body{display:grid;grid-template-columns:28% 1fr;gap:6px;padding:0 8px 8px;min-height:0}
  .s-groups div{padding:5px 8px;border-radius:6px;color:#c9cff0;margin-bottom:3px;white-space:nowrap;overflow:hidden}
  .s-groups div.on{background:rgba(79,107,255,.25);color:#fff;border-left:2px solid var(--accent)}
  .s-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
  .s-card{display:flex;align-items:center;gap:6px;background:#141b45;border-radius:7px;padding:6px}
  .s-card .logo{width:26px;height:18px;border-radius:4px;background:#0b0e13;flex:none;display:grid;place-items:center;color:#7f95ff;font-weight:800;font-size:8px}
  .s-card .t{flex:1;min-width:0}
  .s-card b{display:block;color:#fff;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-card small{color:#a0a8d0;font-size:8px}
  .s-card.focus{background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scale(1.05);box-shadow:0 8px 20px -6px rgba(110,90,255,.9)}
  .s-card.focus small{color:#e8e6ff}
  .s-card .star{color:var(--gold)}
  @media (max-width:480px){.s-grid{grid-template-columns:1fr}.s-grid .s-card:nth-child(n+6){display:none}}
  /* sections */
  section.block{padding:56px 0}
  .head{text-align:center;max-width:640px;margin:0 auto 32px}
  .head h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 10px;letter-spacing:-.01em}
  .head p{color:var(--dim);margin:0}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:880px){.features{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.features{grid-template-columns:1fr}}
  .feat{background:rgba(20,27,69,.75);border:1px solid var(--line);border-radius:16px;padding:20px}
  .feat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,107,255,.3),rgba(138,77,255,.3));margin-bottom:12px;font-size:20px}
  .feat h3{margin:0 0 6px;font-size:16px}
  .feat p{margin:0;color:var(--dim);font-size:14px}
  .install{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:step}
  @media (max-width:880px){.install{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.install{grid-template-columns:1fr}}
  .step{position:relative;background:rgba(20,27,69,.75);border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px}
  .step:before{counter-increment:step;content:counter(step);position:absolute;top:-12px;left:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .step h3{margin:6px 0 6px;font-size:15px}
  .step p{margin:0;color:var(--dim);font-size:13.5px}
  code{font-family:ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
  /* upload (the playlist tool: same markup and behaviour as before) */
  #upload .wrap{max-width:560px;margin:0 auto}
  #upload .upload-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  #upload .upload-head img{width:44px;height:44px;border-radius:12px}
  #upload .upload-head h2{margin:0;font-size:22px}
  #upload .upload-head p{margin:0;color:var(--dim);font-size:13px}
  #upload .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  #upload h2{font-size:16px;margin:0 0 14px}
  #upload label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
  #upload input[type=text],#upload input[type=password],#upload input[type=url],#upload input[type=file]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
  #upload input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  #upload .mac{font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
  #upload button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font-weight:600;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;margin-top:18px}
  #upload button:disabled{opacity:.6;cursor:wait}
  #upload .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);width:auto;margin:0;padding:8px 12px;font-size:13px}
  #upload .msg{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px;display:none}
  #upload .msg.err{display:block;background:rgba(255,93,108,.12);color:var(--err);border:1px solid rgba(255,93,108,.35)}
  #upload .msg.ok{display:block;background:rgba(46,194,126,.12);color:var(--ok);border:1px solid rgba(46,194,126,.35)}
  #upload .tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line)}
  #upload .tabs button{flex:1;margin:0;padding:9px 6px;border-radius:9px;background:transparent;color:var(--dim);font-weight:500;font-size:14px;width:auto}
  #upload .tabs button.on{background:var(--surface2);color:#fff}
  #upload .pane{display:none}#upload .pane.on{display:block}
  #upload ul{list-style:none;margin:0;padding:0}
  #upload li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  #upload li:first-child{border-top:0}
  #upload li .n{flex:1;min-width:0}
  #upload li .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #upload li .n small{color:var(--dim)}
  #upload .steps{color:var(--dim);font-size:14px;margin:0;padding-left:18px}
  #upload .devline{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;margin-bottom:16px;gap:8px}
  #upload .devline .mac{color:var(--text);font-size:15px}
  #upload .hidden{display:none}
  #upload .steps li{display:list-item;border:0;padding:3px 0}
  footer.site{border-top:1px solid rgba(255,255,255,.06);padding:28px 0 40px;color:var(--dim);font-size:13px}
  footer.site .container{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  footer.site a{color:var(--dim)}
  /* language switch + donate */
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:6px}
  .lang button{background:transparent;border:0;color:var(--dim);font:600 12px system-ui;padding:7px 10px;cursor:pointer}
  .lang button.on{background:rgba(255,255,255,.12);color:#fff}
  nav .links a.donate{color:#ffd6e0;border:1px solid rgba(255,120,160,.45)}
  nav .links a.donate:hover{background:rgba(255,120,160,.12)}
  nav .links a{white-space:nowrap}
  .lang{flex:none}
  @media (max-width:640px){nav .links a.donate{display:inline-block;padding:7px 10px}nav .links a.cta{display:none}}
  .support{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;background:linear-gradient(135deg,rgba(79,107,255,.18),rgba(138,77,255,.18));border:1px solid var(--line);border-radius:22px;padding:32px}
  @media (max-width:760px){.support{grid-template-columns:minmax(0,1fr);padding:24px}}
  .support h2{margin:0 0 10px;font-size:clamp(24px,3vw,32px)}
  .support p{margin:0 0 8px;color:var(--dim)}
  .support small{color:var(--dim);font-size:12.5px}
  .pp{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .btn.paypal{justify-content:center;background:#ffc439;color:#111;box-shadow:0 10px 30px -12px rgba(255,196,57,.7)}
  .btn.paypal svg{width:22px;height:22px}
  .amounts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .amounts a{text-decoration:none;color:#fff;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
  .amounts a:hover{background:rgba(255,255,255,.12)}
</style>
</head>
<body>

<nav>
  <div class="container">
    <a class="brand" href="#top"><img src="icon.png" alt="">Faznet</a>
    <div class="links">
      <a href="#features" data-i18n="nav_features"></a>
      <a href="#install" data-i18n="nav_install"></a>
      <a href="#upload" data-i18n="nav_upload"></a>
      <a class="donate" href="#support" data-i18n="nav_donate"></a>
      <a class="cta" href="#download" data-i18n="nav_download"></a>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="sq">SQ</button>
    </div>
  </div>
</nav>

<header class="container hero" id="top">
  <div id="download">
    <span class="badge"><span class="dot"></span> <span data-i18n="badge"></span></span>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="dl">
      <a class="btn primary" href="download/Faznet-TV.apk" download>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/></svg>
        <span><span data-i18n="dl_tv"></span><small data-i18n="dl_tv_sub"></small></span>
      </a>
      <a class="btn secondary" href="download/Faznet-arm64.apk" download>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm0 18H7V5h10v14z"/></svg>
        <span><span data-i18n="dl_phone"></span><small data-i18n="dl_phone_sub"></small></span>
      </a>
    </div>
    <p class="note" data-i18n="dl_note"></p>
  </div>

  <div class="tv" aria-hidden="true">
    <div class="screen">
      <div class="s-top"><i></i><div class="pill"></div><span class="clock">20:45</span></div>
      <div class="s-body">
        <div class="s-groups">
          <div data-i18n="m_all"></div>
          <div data-i18n="m_fav"></div>
          <div class="on" data-i18n="m_news"></div>
          <div data-i18n="m_sport"></div>
          <div data-i18n="m_movies"></div>
          <div data-i18n="m_kids"></div>
          <div data-i18n="m_music"></div>
        </div>
        <div class="s-grid">
          <div class="s-card"><div class="logo">TV1</div><div class="t"><b>News One</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card focus"><div class="logo">TV2</div><div class="t"><b>News Two HD</b><small data-i18n="m_news"></small></div><span class="star">★</span></div>
          <div class="s-card"><div class="logo">TV3</div><div class="t"><b>Channel 3</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card"><div class="logo">TV4</div><div class="t"><b>Info 24</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card"><div class="logo">TV5</div><div class="t"><b>Channel 5 FHD</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card"><div class="logo">TV6</div><div class="t"><b>News Plus</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card"><div class="logo">TV7</div><div class="t"><b>Channel 7</b><small data-i18n="m_news"></small></div></div>
          <div class="s-card"><div class="logo">TV8</div><div class="t"><b>Region TV</b><small data-i18n="m_news"></small></div></div>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="block" id="features">
  <div class="container">
    <div class="head">
      <h2 data-i18n="f_title"></h2>
      <p data-i18n="f_sub"></p>
    </div>
    <div class="features">
      <div class="feat"><div class="ico">⚡</div><h3 data-i18n="f1_t"></h3><p data-i18n="f1_p"></p></div>
      <div class="feat"><div class="ico">🛠️</div><h3 data-i18n="f2_t"></h3><p data-i18n="f2_p"></p></div>
      <div class="feat"><div class="ico">🎬</div><h3 data-i18n="f3_t"></h3><p data-i18n="f3_p"></p></div>
      <div class="feat"><div class="ico">📲</div><h3 data-i18n="f4_t"></h3><p data-i18n="f4_p"></p></div>
      <div class="feat"><div class="ico">🔄</div><h3 data-i18n="f5_t"></h3><p data-i18n="f5_p"></p></div>
      <div class="feat"><div class="ico">🔒</div><h3 data-i18n="f6_t"></h3><p data-i18n="f6_p"></p></div>
    </div>
  </div>
</section>

<section class="block" id="install">
  <div class="container">
    <div class="head">
      <h2 data-i18n="i_title"></h2>
      <p data-i18n="i_sub"></p>
    </div>
    <div class="install">
      <div class="step"><h3 data-i18n="i1_t"></h3><p data-i18n="i1_p"></p></div>
      <div class="step"><h3 data-i18n="i2_t"></h3><p><span data-i18n="i2_p"></span><br><code>whatsthatbrother.github.io/faznet/download/Faznet-TV.apk</code></p></div>
      <div class="step"><h3 data-i18n="i3_t"></h3><p data-i18n="i3_p"></p></div>
      <div class="step"><h3 data-i18n="i4_t"></h3><p data-i18n="i4_p"></p></div>
    </div>
  </div>
</section>

<section class="block" id="upload">
  <div class="container">
   <div class="wrap">
    <div class="upload-head">
      <img src="icon.png" alt="">
      <div><h2 data-i18n="u_title"></h2><p data-i18n="u_sub"></p></div>
    </div>
  <div id="msg" class="msg" role="status"></div>

  <section id="login" class="card">
    <h2 data-i18n="u_connect"></h2>
    <ol class="steps">
      <li data-i18n="u_s1"></li>
      <li data-i18n="u_s2"></li>
      <li data-i18n="u_s3"></li>
    </ol>
    <form id="loginForm" autocomplete="off">
      <label for="mac" data-i18n="u_mac"></label>
      <input class="mac" id="mac" type="text" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="••••" required>
      <button type="submit" data-i18n="u_continue"></button>
    </form>
  </section>

  <section id="device" class="hidden">
    <div class="devline">
      <span><span data-i18n="u_device"></span> <span class="mac" id="devMac"></span> <span id="devModel"></span></span>
      <button class="ghost" id="logout" type="button" data-i18n="u_logout"></button>
    </div>
    <div class="card">
      <h2 data-i18n="u_add"></h2>
      <form id="addForm" autocomplete="off">
        <div class="tabs" role="tablist">
          <button type="button" class="on" data-type="url">M3U URL</button>
          <button type="button" data-type="xtream">Xtream</button>
          <button type="button" data-type="file" data-i18n="u_file_tab"></button>
        </div>
        <label for="name" data-i18n="u_name"></label>
        <input id="name" type="text" maxlength="60" data-i18n-ph="u_name_ph">
        <div class="pane on" data-pane="url">
          <label for="url" data-i18n="u_url"></label>
          <input id="url" type="url" placeholder="http://server.com/get.php?...">
        </div>
        <div class="pane" data-pane="xtream">
          <label for="xserver" data-i18n="u_server"></label><input id="xserver" type="text" placeholder="http://host:port">
          <label for="xuser" data-i18n="u_user"></label><input id="xuser" type="text">
          <label for="xpass" data-i18n="u_pass"></label><input id="xpass" type="password">
        </div>
        <div class="pane" data-pane="file">
          <label for="file" data-i18n="u_file"></label>
          <input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl">
        </div>
        <button type="submit" id="addBtn" data-i18n="u_send"></button>
      </form>
    </div>
    <div class="card">
      <h2 id="listTitle"></h2>
      <ul id="list"></ul>
      <p id="empty" style="color:var(--dim);margin:0" data-i18n="u_empty"></p>
    </div>
  </section>
   </div>
  </div>
</section>

<section class="block" id="support">
  <div class="container">
    <div class="support">
      <div>
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_p1"></p>
        <p data-i18n="s_p2"></p>
        <small data-i18n="s_note"></small>

<script>
(function () {
  var API = (window.FAZNET_API || "").replace(/\/+$/, "");
  // Error texts in the page language (see FZ_I18N above).
  var MSG = new Proxy({}, { get: function (_, k) { var t = T("e_" + String(k)); return t === "e_" + String(k) ? undefined : t; } });
  var $ = function (id) { return document.getElementById(id); };
  var state = { mac: "", pin: "", type: "url", list: null };
  window.FZ_onLang = function () { if (state.list) render(state.list, state.max); };

  function show(text, ok) { var m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); }
  function clearMsg() { $("msg").className = "msg"; }

  function api(path, data) {
    return fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().catch(function () { return { error: "network" }; }); })
      .catch(function () { return { error: "network" }; });
  }

  function render(list, max) {
    var ul = $("list"); ul.innerHTML = "";
    $("empty").style.display = list.length ? "none" : "block";
    state.list = list;
    $("listTitle").textContent = T("u_list") + " (" + list.length + "/" + (max || 20) + ")";
    list.forEach(function (p) {
      var li = document.createElement("li");
      var n = document.createElement("div"); n.className = "n";
      var b = document.createElement("b"); b.textContent = p.name;
      var s = document.createElement("small"); s.textContent = { url: T("u_t_url"), xtream: T("u_t_xtream"), file: T("u_t_file") }[p.type] || "";
      n.appendChild(b); n.appendChild(s);
      var del = document.createElement("button"); del.className = "ghost"; del.type = "button"; del.textContent = T("u_delete");
      del.onclick = function () {
        if (!confirm(T("u_confirm_del", { name: p.name }))) return;
        api("/api/web/delete", { mac: state.mac, pin: state.pin, id: p.id }).then(function (r) {
          if (r.error) return show(MSG[r.error] || r.error);
          render(r.playlists, state.max); show(T("u_deleted"), true);
        });
      };
      li.appendChild(n); li.appendChild(del); ul.appendChild(li);
    });
  }

  $("mac").addEventListener("input", function () {
    var v = this.value.toUpperCase().replace(/[^0-9A-F]/g, "").slice(0, 12);
    this.value = (v.match(/.{1,2}/g) || []).join(":");
  });
  var q = new URLSearchParams(location.search).get("mac");
  if (q) { $("mac").value = q; $("mac").dispatchEvent(new Event("input")); $("pin").focus(); }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault(); clearMsg();
    var btn = e.target.querySelector("button"); btn.disabled = true;
    var mac = $("mac").value, pin = $("pin").value;
    api("/api/web/login", { mac: mac, pin: pin }).then(function (r) {
      btn.disabled = false;
      if (r.error) return show(MSG[r.error] || r.error);
      state.mac = r.mac; state.pin = pin; state.max = r.max;
      $("devMac").textContent = r.mac; $("devModel").textContent = r.model ? "· " + r.model : "";
      $("login").classList.add("hidden"); $("device").classList.remove("hidden");
      render(r.playlists, r.max);
    });
  });

  $("logout").onclick = function () { location.href = location.pathname; };

  document.querySelectorAll(".tabs button").forEach(function (t) {
    t.onclick = function () {
      state.type = t.dataset.type;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === t); });
      document.querySelectorAll(".pane").forEach(function (p) { p.classList.toggle("on", p.dataset.pane === state.type); });
    };
  });

  function send(payload) {
    var btn = $("addBtn"); btn.disabled = true;
    api("/api/web/add", payload).then(function (r) {
      btn.disabled = false;
      if (r.error) return show(MSG[r.error] || r.error);
      render(r.playlists, state.max);
      show(T("u_added"), true);
      $("addForm").reset();
      document.querySelector('.tabs button[data-type="' + state.type + '"]').click();
    });
  }

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault(); clearMsg();
    var base = { mac: state.mac, pin: state.pin, type: state.type, name: $("name").value.trim() };
    // Never name a playlist after its server address: the TV shows the name.
    if (!base.name && state.type !== "file") base.name = (state.type === "xtream" ? T("u_default_xtream") : T("u_default_list")) + (($("list").children.length || 0) + 1);
    if (state.type === "url") { base.url = $("url").value.trim(); return send(base); }
    if (state.type === "xtream") {
      base.server = $("xserver").value.trim(); base.username = $("xuser").value.trim(); base.password = $("xpass").value;
      return send(base);
    }
    var f = $("file").files[0];
    if (!f) return show(MSG.fields);
    if (f.size > 20 * 1024 * 1024) return show(T("u_too_big"));
    var rd = new FileReader();
    rd.onload = function () { base.content = rd.result; if (!base.name) base.name = f.name.replace(/\.[^.]+$/, ""); send(base); };
    rd.readAsText(f);
  });
})();
</script>

name: Build

# CI check only. Signed release APKs are built locally (the signing key is not in this repository)
# and attached to GitHub Releases by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      # An error here is usually a crash on some device (minSdk 23).
      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: Faznet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
